name: Quirk Contracts Conformance

on:
  pull_request:
    paths:
      - 'contracts/v0.2/**'
      - '.github/workflows/quirk-contracts-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/v0.2/**'
      - '.github/workflows/quirk-contracts-conformance.yml'

permissions:
  contents: read

jobs:
  frozen-contracts:
    name: frozen-contracts-v0.2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5'
      - name: Verify frozen tranche digest and fixture outcomes
        run: python contracts/v0.2/check-contract-tranche.py
