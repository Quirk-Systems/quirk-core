name: Quirk Contracts Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quirk-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-contracts:
    name: frozen-contracts-v0.2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5'
      - name: Verify frozen tranche digest and fixture outcomes
        run: python contracts/v0.2/check-contract-tranche.py
